name: Public self-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same ref; job names and matrix stay unchanged because
# they are the required-check contexts protected by the branch ruleset.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  public-selftest:
    name: Public self-test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']
    steps:
      # Official actions/checkout v7.0.1; verified via GitHub tag-ref API (2026-10-29, dependabot #12 SHA re-checked).
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Official actions/setup-node v7.1.0; verified via GitHub tag-ref API (2026-10-29, dependabot #13 SHA re-checked).
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      # The public entry point is integrated separately; do not skip a missing file.
      - name: Run isolated public self-test
        run: node scripts/selftest-public.js
